# Generate Maple.xcodeproj with `xcodegen`; the project file itself isn't committed.
name: Maple
options:
  bundleIdPrefix: dev.maple
  deploymentTarget:
    iOS: "26.0"
targets:
  Maple:
    type: application
    platform: iOS
    sources: [Maple]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: Maple/Info.plist
      properties:
        CFBundleDisplayName: Maple
        MODEL_API_KEY: $(MODEL_API_KEY)
        TYPESAFE_API_KEY: $(TYPESAFE_API_KEY)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        NSMicrophoneUsageDescription: Ask out loud by squeezing Apple Pencil Pro or tapping the microphone. Your recording goes to Meta to transcribe and answer it.
        NSCalendarsFullAccessUsageDescription: Maple reads your calendar to answer questions on your page, like when you're free. What it reads goes to Meta with your question.
        NSRemindersFullAccessUsageDescription: Maple reads your reminders to answer questions on your page, like what's left on a list. What it reads goes to Meta with your question.
        NSContactsUsageDescription: Maple looks up people you ask about, like a phone number or a birthday. What it reads goes to Meta with your question.
        NSPhotoLibraryUsageDescription: Maple looks at photos you ask about, like a whiteboard or a receipt. The photos it looks at go to Meta with your question.
        UILaunchScreen: {}
        UIAppFonts: [Handlee-Regular.ttf]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maple.muse
        DEVELOPMENT_TEAM: 2FN5ZL5G56
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MapleDeviceChecks:
    type: bundle.unit-test
    platform: iOS
    sources: [checks/device]
    dependencies:
      - target: Maple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maple.device-checks
        DEVELOPMENT_TEAM: 2FN5ZL5G56
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  Maple:
    build:
      targets:
        Maple: all
    test:
      targets: [MapleDeviceChecks]
